name: Deploy Ledgerleaf to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "shop-ledger/**"
      - ".github/workflows/deploy-ledgerleaf.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: shop-ledger
        run: npm install
      - name: Run tests
        working-directory: shop-ledger
        run: npm test
      - name: Type-check
        working-directory: shop-ledger
        run: npm run typecheck
      - name: Build app
        working-directory: shop-ledger
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shop-ledger/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
